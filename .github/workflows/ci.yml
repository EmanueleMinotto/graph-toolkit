name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm turbo run typecheck test build
      - run: pnpm -r --filter "./packages/*" exec publint
      - run: pnpm -r --filter "./packages/*" exec attw --pack .
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: packages/*/coverage
          if-no-files-found: ignore
      - run: pnpm docs:api

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - run: pnpm --filter @graph-toolkit/web exec playwright install --with-deps
      # Software OpenGL so headless Firefox can create a WebGL context.
      - run: sudo apt-get install -y --no-install-recommends libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers xvfb
      - run: xvfb-run --auto-servernum pnpm --filter @graph-toolkit/web e2e
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'

  visual:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - run: pnpm --filter @graph-toolkit/web exec playwright install --with-deps chromium
      - run: pnpm --filter @graph-toolkit/web exec playwright test --project=chromium e2e/visual.spec.ts
        env:
          VISUAL: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-baselines
          path: apps/web/e2e/__screenshots__
          if-no-files-found: ignore
