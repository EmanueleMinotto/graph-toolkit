name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm turbo run typecheck test build
      - run: pnpm -r --filter "./packages/*" --filter "!@graph-sdk/test-utils" exec publint
      - run: pnpm -r --filter "./packages/*" --filter "!@graph-sdk/test-utils" exec attw --pack .
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: packages/*/coverage
          if-no-files-found: ignore
      - run: pnpm docs:api

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    # One runner per browser, the slow ones split in two shards: all run in parallel.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, shard: 1/1 }
          - { browser: firefox, shard: 1/2 }
          - { browser: firefox, shard: 2/2 }
          - { browser: webkit, shard: 1/2 }
          - { browser: webkit, shard: 2/2 }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - uses: actions/cache@v4
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: pnpm --filter @graph-sdk/web exec playwright install --with-deps ${{ matrix.browser }}
      # The cache holds the binaries only: the system libraries still need installing.
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: pnpm --filter @graph-sdk/web exec playwright install-deps ${{ matrix.browser }}
      # Software OpenGL so headless Firefox can create a WebGL context.
      - run: sudo apt-get install -y --no-install-recommends libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers xvfb
      - run: xvfb-run --auto-servernum pnpm --filter @graph-sdk/web e2e --project=${{ matrix.browser }} --shard=${{ matrix.shard }}
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'

  visual:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - run: pnpm --filter @graph-sdk/web exec playwright install --with-deps chromium
      - run: pnpm --filter @graph-sdk/web exec playwright test --project=chromium e2e/visual.spec.ts
        env:
          VISUAL: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-baselines
          path: apps/web/e2e/__screenshots__
          if-no-files-found: ignore
