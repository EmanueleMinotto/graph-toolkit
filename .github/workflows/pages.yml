name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - run: pnpm docs:api
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R docs/api _site/api
          cp -R apps/web/dist _site/app
          printf '<!doctype html><title>graph-toolkit</title><h1>graph-toolkit</h1><ul><li><a href="app/">Web app</a></li><li><a href="api/">API reference</a></li></ul>' > _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      # The artifact listing API is eventually consistent; deploying immediately can find 0 artifacts.
      - run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
