name: Mutation testing

on:
  pull_request:
    paths:
      - 'packages/*/src/**'
      - 'stryker.config.base.mjs'
      - '.github/workflows/mutation.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Stryker's incremental files let a run re-test only what changed since the last one.
      - uses: actions/cache@v6
        with:
          path: packages/*/.stryker-tmp/incremental.json
          key: stryker-${{ runner.os }}-${{ github.sha }}
          restore-keys: stryker-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: packages/*/reports/mutation
          if-no-files-found: ignore
